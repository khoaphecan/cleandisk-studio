[package]
name = "download_cleaner"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.27"
notify = "6.1"
directories = "5.0"
rfd = "0.14"
sysinfo = "0.30"
walkdir = "2.5"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.14"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }